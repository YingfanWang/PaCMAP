[build-system]
requires = ["setuptools>=64", "Cython>=3.0", "numpy>=1.22"]
build-backend = "setuptools.build_meta"

[project]
name = "pacmap-sklearn"
version = "0.1.0.dev0"
description = "scikit-learn-conformant port of PaCMAP (Cython kernels, no numba/faiss)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]
parity = ["pacmap", "numba", "faiss-cpu"]

[tool.setuptools]
packages = ["pacmap_sklearn", "pacmap_sklearn.tests"]

[tool.pytest.ini_options]
testpaths = ["pacmap_sklearn/tests"]
